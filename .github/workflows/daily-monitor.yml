# /**************************************************************
#  * @name 로봇 채용 일일 수집 및 웹 배포
#  * @file .github/workflows/daily-monitor.yml
#  * @version v03
#  * @description GitHub Actions 매일 KST 07:10 수집 → 기록 저장 → GitHub Pages 갱신
#  * @author OpenAI ChatGPT
#  * @date 2026-10-16
#  * @Revisions
#  * - 현재 버전:
#  *   1) 사람인 승인 API 키를 GitHub Secret으로 선택적 전달
#  *   1) 매일 예약/수동 실행/최초 업로드 실행
#  *   2) 이력 JSON 변경 커밋 및 GitHub Pages 발행
#  * - 이전 버전:
#  *   1) 최초 작성
#  **************************************************************/
name: Robot Watch Daily Monitor
on:
  workflow_dispatch:
  schedule:
    # 22:10 UTC = next-day 07:10 KST (may be delayed by GitHub)
    - cron: '10 22 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: robot-watch-daily
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression checks v04
        run: |
          python -m pip install -q pytest
          python -m pytest -q
      - name: Collect public recruitment posts
        env:
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
        run: python -m crawler.collect
      - name: Commit current data and history
        shell: bash
        run: |
          git config user.name 'robot-watch[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh robot recruitment feed [skip ci]'
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
